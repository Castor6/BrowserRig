name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: github.event_name == 'pull_request'
        run: >-
          pnpm check:extension-release
          --base ${{ github.event.pull_request.base.sha }}
          ${{ github.event.pull_request.head.ref == 'changeset-release/main' && '--allow-version-update' || '' }}
      - run: pnpm run ci
