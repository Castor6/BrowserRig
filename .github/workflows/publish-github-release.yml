name: Publish GitHub release

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: browserrig-publish-github-release
  cancel-in-progress: false

jobs:
  finalize:
    if: github.repository == 'Castor6/BrowserRig' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:github --workflow release.yml
        env:
          GITHUB_TOKEN: ${{ github.token }}
