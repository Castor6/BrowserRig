name: Publish release

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:
    inputs:
      confirm_package:
        description: Type BrowserRig to build release artifacts from main
        required: true
        type: string
      stage_version:
        description: Optional exact npm version to stage for human approval (blank builds only)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: browserrig-release-candidate
  cancel-in-progress: false

jobs:
  package:
    if: >-
      ${{
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.merged == true &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.head.ref == 'changeset-release/main' &&
          github.event.pull_request.head.repo.full_name == github.repository
        ) || (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          inputs.confirm_package == 'BrowserRig'
        )
      }}
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.intent.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.18.0
      - id: intent
        name: Validate release intent
        env:
          STAGE_VERSION: ${{ inputs.stage_version }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_COMMIT: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version
          const requested = process.env.STAGE_VERSION || ''
          if (requested && requested !== version) throw new Error('stage_version must match package.json exactly')
          const staged = process.env.RELEASE_EVENT === 'pull_request' || requested !== ''
          const prefix = staged ? 'browserrig-release-candidate-v2-' : 'browserrig-build-only-'
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `artifact-name=${prefix}${process.env.RELEASE_COMMIT}\n`)
          JS
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
      - run: pnpm package:npm
      - run: >-
          pnpm release:manifest
          --commit ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.intent.outputs.artifact-name }}
          path: |
            artifacts/browserrig-*.tgz
            artifacts/browserrig-extension-*.zip
            artifacts/release-manifest.json
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

  publish-npm:
    if: >-
      ${{
        (github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.ref == 'changeset-release/main' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        inputs.confirm_package == 'BrowserRig' && inputs.stage_version != '')
      }}
    needs: package
    runs-on: ubuntu-latest
    environment: npm-publishing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.18.0
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.package.outputs.artifact-name }}
          path: artifacts
      - id: candidate
        name: Verify the immutable release candidate
        run: |
          result="$(node scripts/release-manifest.ts --verify --artifacts artifacts)"
          npm_artifact="$(node --input-type=module -e '
            const value = JSON.parse(process.argv[1])
            if (value.manifest.commit !== process.argv[2]) {
              throw new Error("Release manifest commit does not match this workflow")
            }
            console.log(value.npmArtifactPath)
          ' "$result" "${{ github.event.pull_request.merge_commit_sha || github.sha }}")"
          case "$npm_artifact" in
            "$GITHUB_WORKSPACE"/artifacts/browserrig-*.tgz) ;;
            *) echo "Release manifest returned an unsafe npm artifact path" >&2; exit 1 ;;
          esac
          echo "npm-artifact=$npm_artifact" >> "$GITHUB_OUTPUT"
      - name: Stage verified npm package for human approval
        run: >-
          npm stage publish "${{ steps.candidate.outputs.npm-artifact }}"
          --access public
          --provenance
          --registry=https://registry.npmjs.org
      - name: Explain npm approval
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## npm approval required
          The candidate is staged, not publicly published. Open npm's **Staged Packages** tab,
          inspect the version and provenance, and approve it with 2FA.
          Alternatively use `npm stage list browserrig`, `npm stage view <stage-id>`,
          and `npm stage approve <stage-id>` in your authenticated local npm CLI.

          **Publish GitHub release** checks every five minutes after approval. You can also
          run it manually on main. It verifies the public npm tarball, submits the retained
          Chrome extension ZIP, and publishes the GitHub Release. Do not rebuild or rerun
          staging for a version that is already staged; inspect it first.
          EOF
