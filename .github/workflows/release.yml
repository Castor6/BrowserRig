name: Publish release

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:
    inputs:
      confirm_package:
        description: Type BrowserRig to build release artifacts from main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: browserrig-release-candidate
  cancel-in-progress: false

jobs:
  package:
    if: >-
      ${{
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.merged == true &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.head.ref == 'changeset-release/main' &&
          github.event.pull_request.head.repo.full_name == github.repository
        ) || (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          inputs.confirm_package == 'BrowserRig'
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
      - run: pnpm package:npm
      - run: >-
          pnpm release:manifest
          --commit ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: browserrig-release-candidate-v1-${{ github.event.pull_request.merge_commit_sha || github.sha }}
          path: |
            artifacts/browserrig-*.tgz
            artifacts/browserrig-extension-*.zip
            artifacts/release-manifest.json
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

  publish-npm:
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.ref == 'changeset-release/main' &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    needs: package
    runs-on: ubuntu-latest
    environment: npm-publishing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.18.0
      - uses: actions/download-artifact@v8
        with:
          name: browserrig-release-candidate-v1-${{ github.event.pull_request.merge_commit_sha }}
          path: artifacts
      - id: candidate
        name: Verify the immutable release candidate
        run: |
          result="$(node scripts/release-manifest.ts --verify --artifacts artifacts)"
          npm_artifact="$(node --input-type=module -e '
            const value = JSON.parse(process.argv[1])
            if (value.manifest.commit !== process.argv[2]) {
              throw new Error("Release manifest commit does not match this workflow")
            }
            console.log(value.npmArtifactPath)
          ' "$result" "${{ github.event.pull_request.merge_commit_sha }}")"
          case "$npm_artifact" in
            "$GITHUB_WORKSPACE"/artifacts/browserrig-*.tgz) ;;
            *) echo "Release manifest returned an unsafe npm artifact path" >&2; exit 1 ;;
          esac
          echo "npm-artifact=$npm_artifact" >> "$GITHUB_OUTPUT"
      - name: Publish verified npm package
        run: >-
          npm publish "${{ steps.candidate.outputs.npm-artifact }}"
          --access public
          --provenance
          --registry=https://registry.npmjs.org

  publish-extension:
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.ref == 'changeset-release/main' &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    needs:
      - package
      - publish-npm
    runs-on: ubuntu-latest
    environment: chrome-web-store-publishing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: browserrig-release-candidate-v1-${{ github.event.pull_request.merge_commit_sha }}
          path: artifacts
      - id: google-auth
        name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CHROME_WEB_STORE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
      - name: Upload and submit the verified extension
        env:
          CHROME_WEB_STORE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          CHROME_WEB_STORE_PUBLISHER_ID: ${{ vars.CHROME_WEB_STORE_PUBLISHER_ID }}
        run: >-
          node scripts/publish-chrome-web-store.ts
          --artifacts artifacts
          --commit ${{ github.event.pull_request.merge_commit_sha }}
          --publisher-id "$CHROME_WEB_STORE_PUBLISHER_ID"
          --item-id dbobcmjamjdknplkplgdihdnmdjklpin
