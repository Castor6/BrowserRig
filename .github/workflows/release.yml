name: Prepare release candidate

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:
    inputs:
      confirm_package:
        description: Type BrowserRig to build release artifacts from main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: browserrig-release-candidate
  cancel-in-progress: false

jobs:
  package:
    if: >-
      ${{
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.merged == true &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.head.ref == 'changeset-release/main' &&
          github.event.pull_request.head.repo.full_name == github.repository
        ) || (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          inputs.confirm_package == 'BrowserRig'
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
      - run: pnpm package:npm
      - uses: actions/upload-artifact@v7
        with:
          name: browserrig-release-candidate-${{ github.event.pull_request.merge_commit_sha || github.sha }}
          path: |
            artifacts/browserrig-*.tgz
            artifacts/browserrig-extension-*.zip
          if-no-files-found: error
          retention-days: 14
