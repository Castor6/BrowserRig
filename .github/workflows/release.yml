name: Prepare release candidate

on:
  workflow_dispatch:
    inputs:
      confirm_package:
        description: Type BrowserRig to build release artifacts from main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: browserrig-release-candidate
  cancel-in-progress: false

jobs:
  package:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_package == 'BrowserRig' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
      - run: pnpm package:npm
      - uses: actions/upload-artifact@v7
        with:
          name: browserrig-release-candidate-${{ github.sha }}
          path: |
            artifacts/browserrig-*.tgz
            artifacts/browserrig-extension-*.zip
          if-no-files-found: error
          retention-days: 14
