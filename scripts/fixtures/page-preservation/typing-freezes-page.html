<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Manage my booking · Preservation Fixture</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; color: #1b1b1f; }
  form { display: grid; gap: 1rem; max-width: 24rem; }
  label { display: grid; gap: .25rem; font-size: .9rem; }
  input { font: inherit; padding: .5rem; border: 1px solid #7a7f8a; border-radius: .4rem; }
  #freeze-state { font-size: .9rem; color: #555; }
</style>
</head>
<body>
<!-- Adapted from upstream #93: bounded typing-freezes-page fixture. -->
<h1>Manage my booking</h1>
<form id="mmb" autocomplete="off">
  <label>Booking code <input id="pnr" name="pnr" maxlength="6" placeholder="ABC123"></label>
  <label>Last name <input id="last-name" name="lastName" placeholder="Smith"></label>
  <button type="submit" id="find">Find booking</button>
</form>
<p id="freeze-state" data-freeze="idle">Interactive</p>
<script>
(() => {
  const params = new URLSearchParams(location.search)
  const freezeMs = Math.max(0, Number(params.get("freeze") ?? 40000))
  const chunkMs = Math.max(1, Number(params.get("chunk") ?? 6000))
  const state = document.getElementById("freeze-state")
  window.__gauntlet = { freezeMs, chunkMs, frozenAt: null, releasedAt: null }
  let started = false

  const blockUntil = (end) => { while (performance.now() < end) { /* synchronous long task */ } }

  document.getElementById("pnr").addEventListener("keydown", (event) => {
    if (!event.isTrusted || started) return
    started = true
    window.__gauntlet.frozenAt = Date.now()
    state.textContent = "Bot sensor engaged: main thread frozen"
    state.dataset.freeze = "frozen"
    const freezeEnd = performance.now() + freezeMs
    const step = () => {
      blockUntil(Math.min(performance.now() + chunkMs, freezeEnd))
      if (performance.now() < freezeEnd) {
        setTimeout(step, 0)
        return
      }
      window.__gauntlet.releasedAt = Date.now()
      state.textContent = "Freeze released"
      state.dataset.freeze = "released"
    }
    step()
  })

  document.getElementById("mmb").addEventListener("submit", (event) => {
    event.preventDefault()
    state.textContent = `Looking up ${document.getElementById("pnr").value} / ${document.getElementById("last-name").value}`
  })
})()
</script>
</body>
</html>
